# Review and copy into the CLEAN public repository, not this private workspace.
# Official action major versions were checked on 2026-10-28. Pin reviewed commit
# SHAs before enabling a production release pipeline.
name: Bright Vision source checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Verify release preparation tooling
        run: node --test tools/bright-open-source/tests/prepare-github-release.test.mjs
      - name: Verify civil wall evidence gates without Revit
        run: node --test tools/bright-revit-exporter/tests/civil-wall-host-verifier.test.mjs
      - name: Install locked viewer dependencies
        working-directory: tools/bim-viewer
        run: npm ci
      - name: Verify viewer source and pure Web build
        working-directory: tools/bim-viewer
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Verify navigation and local assistant in a headless browser
        working-directory: tools/bim-viewer
        env:
          BIM_TEST_BROWSER: /usr/bin/google-chrome
        run: npm run test:background
      # The background runner serves only the current build over loopback,
      # uses synthetic models, and fails on external page requests. It never
      # opens Electron/Revit or sends input to a native desktop window.
      # Use the hosted Ubuntu image's system Chrome with its normal sandbox;
      # do not modify AppArmor, user namespaces or browser security policy.
      # Full Revit builds need legally obtained local API references. This job
      # neither redistributes Autodesk DLLs nor claims live Revit acceptance.
      # Do not add signing keys, public release writes, or a self-hosted runner
      # to untrusted pull_request jobs.
  publisher-contract:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Verify draft arguments and signing gate with an inert recording tool
        shell: powershell
        run: '& tools/bright-open-source/tests/Test-PublishGitHubDraft.ps1'
      - name: Verify native snapshot comparer with a pure Framework DLL fixture
        shell: powershell
        run: '& tools/bright-revit-exporter/tests/host/Test-CivilSnapshotComparison.ps1'
      - name: Verify wall projected area and quantity attribution without Revit
        shell: powershell
        run: |
          & tools/bright-revit-exporter/tests/Test-CivilWallCalculation.ps1
          & tools/bright-revit-exporter/tests/Test-CivilWallReport.ps1
      - name: Verify wall workbench in offscreen WPF without desktop input
        shell: powershell
        run: '& tools/bright-revit-exporter/tests/Test-CivilWallUi.ps1'
      # This test resolves gh.exe only to its own recording PowerShell script.
      # It never contacts GitHub, creates a tag, uploads or starts an installer.
